<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LinguaAI – A free, lightweight language translation tool. Translate text between 30+ languages instantly."
    />
    <title>LinguaAI – Translate your words. Connect your world.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ═══════════════════════════════════════════════════════
         HEADER
    ═══════════════════════════════════════════════════════ -->
    <header class="site-header" role="banner">
      <div class="header-inner">
        <div class="logo-group">
          <div class="logo-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="16" cy="16" r="16" fill="url(#grad)"/>
              <path d="M8 12h7M11.5 9v3M8 12c0 3 1.5 5 3.5 5s3.5-2 3.5-5"
                    stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M16 22l4-9 4 9M17.5 19.5h5" stroke="#fff"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <defs>
                <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32"
                  gradientUnits="userSpaceOnUse">
                  <stop stop-color="#4F46E5"/>
                  <stop offset="1" stop-color="#6366F1"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div>
            <h1 class="site-title">LinguaAI</h1>
            <p class="site-tagline">Translate your words. Connect your world.</p>
          </div>
        </div>
        <nav class="site-nav" aria-label="Site navigation">
          <span class="nav-badge">Powered by MyMemory</span>
        </nav>
      </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════
         MAIN CONTENT
    ═══════════════════════════════════════════════════════ -->
    <main class="main-content" id="main">

      <!-- Language Controls Bar -->
      <div class="lang-controls card" role="region" aria-label="Language selection">
        <div class="lang-select-group">
          <label for="source-lang" class="sr-only">Source language</label>
          <select id="source-lang" class="lang-select" aria-label="Source language">
          </select>
        </div>

        <button
          id="swap-btn"
          class="swap-btn"
          aria-label="Swap source and target languages"
          title="Swap languages"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4m0 0L3 8m4-4l4 4"/>
            <path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
          </svg>
        </button>

        <div class="lang-select-group">
          <label for="target-lang" class="sr-only">Target language</label>
          <select id="target-lang" class="lang-select" aria-label="Target language">
          </select>
        </div>
      </div>

      <!-- Translation Panels -->
      <div class="panels-row">

        <!-- Source Panel -->
        <section class="panel card" aria-labelledby="source-heading">
          <div class="panel-header">
            <span id="source-heading" class="panel-label">
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
              </svg>
              Source Text
            </span>
            <button id="clear-source-btn" class="icon-btn" aria-label="Clear source text" title="Clear text">
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
              </svg>
            </button>
          </div>

          <textarea
            id="source-text"
            class="text-area"
            placeholder="Enter text to translate…"
            aria-label="Source text input"
            maxlength="500"
            rows="8"
            spellcheck="true"
          ></textarea>

          <div class="panel-footer">
            <span id="char-count" class="char-counter" aria-live="polite" aria-atomic="true">
              0 / 500
            </span>
            <button id="translate-btn" class="translate-btn" aria-label="Translate text">
              <span class="btn-text">Translate</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
          </div>
        </section>

        <!-- Target Panel -->
        <section class="panel card" aria-labelledby="target-heading">
          <div class="panel-header">
            <span id="target-heading" class="panel-label">
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
              </svg>
              Translation
            </span>
            <button
              id="copy-btn"
              class="icon-btn"
              aria-label="Copy translated text"
              title="Copy translation"
              disabled
            >
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M8 2a1 1 0 000 2h2a1 1 0 100-2H8z"/>
                <path d="M3 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v6h-4.586l1.293-1.293a1 1 0 00-1.414-1.414l-3 3a1 1 0 000 1.414l3 3a1 1 0 001.414-1.414L10.414 13H15v3a2 2 0 01-2 2H5a2 2 0 01-2-2V5z"/>
              </svg>
            </button>
          </div>

          <div
            id="output-area"
            class="output-area"
            role="region"
            aria-live="polite"
            aria-atomic="true"
            aria-label="Translation result"
          >
            <p class="output-placeholder">Your translation will appear here.</p>
          </div>

          <div class="panel-footer">
            <span id="copy-toast" class="copy-toast" aria-live="polite" role="status"></span>
            <button id="clear-output-btn" class="ghost-btn" disabled>
              Clear
            </button>
          </div>
        </section>

      </div>

      <!-- Error Banner -->
      <div
        id="error-banner"
        class="error-banner"
        role="alert"
        aria-live="assertive"
        hidden
      >
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span id="error-message"></span>
      </div>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer" role="contentinfo">
      <p>
        LinguaAI &mdash; CodeAlpha Internship Project &bull;
        Translation by <a href="https://mymemory.translated.net/" target="_blank" rel="noopener noreferrer">MyMemory</a>
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
